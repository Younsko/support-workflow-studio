[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-workflow-studio"
version = "0.1.0"
description = "A local, human-reviewed AI support workflow showcase"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
control-plane = ["PyJWT[crypto]>=2.10,<3"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
