name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: support_workflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d support_workflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package and development tools
        run: python -m pip install -e ".[dev,postgres]"
      - name: Check Python lint
        run: python -m ruff check backend/app backend/tests
      - name: Run backend tests
        run: python -m pytest -q
        env:
          POSTGRES_TEST_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/support_workflow_test
      - name: Check Python compilation
        run: python -m compileall -q backend/app backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
